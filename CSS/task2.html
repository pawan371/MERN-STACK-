<!DOCTYPE html>
<html>

<head>
    <title>Colorful Animated Grid</title>
</head>

<body>

    <h1 align="center">3 × 3 Colorful Animated Grid</h1>

    <table border="2" width="100%" height="500" cellspacing="5">

        <tr>
            <td bgcolor="red" align="center">
                <marquee direction="left" behavior="scroll">
                    <font color="white" size="5">WELCOME</font>
                </marquee>
            </td>

            <td bgcolor="blue" align="center">
                <marquee direction="right" behavior="alternate">
                    <font color="white" size="5">HTML</font>
                </marquee>
            </td>

            <td bgcolor="green" align="center">
                <marquee direction="up" behavior="scroll">
                    <font color="white" size="5">CODING</font>
                </marquee>
            </td>
        </tr>

        <tr>
            <td bgcolor="orange" align="center">
                <marquee direction="down" behavior="alternate">
                    <font color="white" size="5">DESIGN</font>
                </marquee>
            </td>

            <td bgcolor="purple" align="center">
                <marquee direction="left" behavior="alternate">
                    <font color="white" size="5">LEARN</font>
                </marquee>
            </td>

            <td bgcolor="brown" align="center">
                <marquee direction="right" behavior="scroll">
                    <font color="white" size="5">CREATE</font>
                </marquee>
            </td>
        </tr>

        <tr>
            <td bgcolor="pink" align="center">
                <marquee direction="up" behavior="alternate">
                    <font color="black" size="5">PRACTICE</font>
                </marquee>
            </td>

            <td bgcolor="teal" align="center">
                <marquee direction="down" behavior="scroll">
                    <font color="white" size="5">SUCCESS</font>
                </marquee>
            </td>

            <td bgcolor="gold" align="center">
                <marquee direction="left" behavior="scroll">
                    <font color="black" size="5">KEEP GOING</font>
                </marquee>
            </td>
        </tr>

    </table>

</body>

</html>
