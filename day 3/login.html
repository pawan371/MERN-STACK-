<html lang="en">

<head>

    <link rel="stylesheet" href="login.css">

<body>
    <h1>Login & SignUp</h1>
    <form>
        <label for="name">Name : </label>
        <input type="text" name="name" placeholder="Enter your name">

        <label for="phone no">Mobile no. :</label>
        <input type="number" name="phone no" placeholder="Enter your mobile no.">

        <label for="email">Email id. :</label>

        <br><br>
        <label for="fathername">Father Name :</label>
        <input type="text" name="fathername" placeholder="Enter your father name">
        <br><br>
        <label for="father no.">Father Mobile No :</label>
        <input type="number" name="f_name" placeholder="Enter your parent mobile no.">
        <br><br>
        <h2>Select City :</h2>
        <select>
            <option>Lucknow</option>
            <option>Agra</option>
            <option>Ayodhya</option>
        </select>


    </form>

</html>
