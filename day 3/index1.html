<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
    </link>
</head>

<body>
    <table>
        <!--Header-->
        <tr>
            <td colspan="4" class="header">Header Section</td>
        </tr>
        <!--Navigation-->
        <tr>
            <td class="nav">Home</td>
            <td class="nav">About</td>
            <td class="nav">Contact</td>
            <td class="nav">Login</td>
        </tr>
        <!--Main Section-->
        <tr>
            <!--Left Notification-->
            <td class="notification">
                <marquee direction="up">Show Notification in marquee</marquee>
            </td>
            <!--Right Form-->
            <td colspan="3" class="form">
                <h2>Make Form in this section</h2>
                <form>
                    <input type="text" placeholder="Enter Name"><br>
                    <input type="email" placeholder="Enter Email"><br>
                    <input type="password" placeholder="Email Password">
                    <input type="submit" value="Submit" </form>
            </td>
        </tr>
        <!--Footer-->
        <tr>
            <td colspan="4" class="footer">Footer Section</td>
        </tr>
    </table>



</body>

</html>
